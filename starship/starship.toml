add_newline = false
# A minimal left prompt
format = """$directory$character"""
palette = "catppuccin_mocha"
# move the rest of the prompt to the right
right_format = """$all"""
command_timeout = 1000

[gcloud]
# there was no gcloud configured here
# disable it because it was found to be a culprit
disabled = true
# the glcoud related config from:
# starship print-config > /tmp/effective-starship.toml
# [gcloud]
# format = 'on [$symbol$account(@$domain)(\($region\))]($style) '
# symbol = "☁️   "
# style = "bold blue"
# disabled = false
# detect_env_vars = []
#
# [gcloud.region_aliases]
#
# [gcloud.project_aliases]

[time]
disabled = false
format = "[$time]($style)"     # simple, ASCII-only
time_format = "%H:%M"
style = "bold dimmed"

[battery]
disabled = false
# Always show battery; pick the first matching threshold
display = [ { threshold = 100 } ]

[status]
disabled = false
format = "[$symbol $status]($style)"
map_symbol = true

[directory.substitutions]
'~/tests/starship-custom' = 'work-project'

[git_branch]
format =  '[$symbol$branch(:$remote_branch)]($style)'

[aws]
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
disabled = false
style = 'bold blue'
symbol = " "

[golang]
format = '[ ](bold cyan)'

[kubernetes]
symbol = '☸ '
disabled = true
detect_files = ['Dockerfile']
format = '[$symbol$context( \($namespace\))]($style) '
contexts = [
  { context_pattern = "arn:aws:eks:us-west-2:577926974532:cluster/zd-pvc-omer", style = "green", context_alias = "omerxx", symbol = " " },
]

[docker_context]
disabled = true

